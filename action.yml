name: "Laya-as-a-Judge AI Evaluation & Guardrail Gate"
description: "Zero-output-token LLM/agent evaluation, RAG faithfulness CI gate (with SARIF 2.1.0), RAIL Guard & DecisionBench checks."
author: "radeksixi"

branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Execution mode: 'eval' (JSONL batch CI gate), 'rail-guard' (HF safety benchmark), or 'decision-bench' (wire check)."
    required: false
    default: "eval"
  file:
    description: "Path to JSONL evaluation file (required when mode='eval')."
    required: false
    default: "data/sample_rag_eval.jsonl"
  judge:
    description: "Built-in judge preset for mode='eval' (faithfulness, safety, relevance, instruction, pairwise, agent, redteam)."
    required: false
    default: "faithfulness"
  gate-judgement:
    description: "Criterion name to enforce in CI gate (e.g. is_faithful, is_safe). Empty disables failing exit code."
    required: false
    default: ""
  max-failing:
    description: "Maximum allowed failing share in [0.0, 1.0] before failing the workflow."
    required: false
    default: "0.05"
  output:
    description: "Output report path (JSONL or SARIF 2.1.0)."
    required: false
    default: "laya-eval-results.jsonl"
  format:
    description: "Output report format for mode='eval': 'jsonl' or 'sarif'."
    required: false
    default: "jsonl"
  backend:
    description: "Engine backend ('emulator', 'auto', 'torch', 'mlx')."
    required: false
    default: "emulator"
  package-version:
    description: "PyPI version specifier for laya-as-judge (default: latest v1.x)."
    required: false
    default: ">=1.1.1,<2.0.0"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.12"

outputs:
  report-path:
    description: "Path to the generated evaluation report (JSONL, JSON, or SARIF 2.1.0)."
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install laya-as-judge from PyPI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "laya-as-judge${{ inputs.package-version }}"

    - name: Run Laya-as-a-Judge Gate
      shell: bash
      run: |
        set -euo pipefail
        MODE="${{ inputs.mode }}"
        if [ "$MODE" = "eval" ]; then
          ARGS=(eval --judge "${{ inputs.judge }}" --file "${{ inputs.file }}" --backend "${{ inputs.backend }}" --output "${{ inputs.output }}" --format "${{ inputs.format }}")
          if [ -n "${{ inputs.gate-judgement }}" ]; then
            ARGS+=(--gate-judgement "${{ inputs.gate-judgement }}" --max-failing "${{ inputs.max-failing }}")
          fi
          laya-judge "${ARGS[@]}"
        elif [ "$MODE" = "rail-guard" ]; then
          laya-judge rail-guard --source fixture --profile "${{ inputs.backend }}" --output "${{ inputs.output }}"
        elif [ "$MODE" = "decision-bench" ]; then
          laya-judge decision-bench --profile "${{ inputs.backend }}" > "${{ inputs.output }}"
        else
          echo "Unsupported mode: $MODE" >&2
          exit 2
        fi
