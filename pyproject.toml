[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-as-judge"
version = "0.4.0"
description = "Calibrated, hybrid local + cloud decision evaluation engine (Laya-Omega) used with sixi.ai — beating frontier LLM-as-a-Judge & Gemini Decision 1 across text, vision, audio, and video"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "radeksixi" }
]
keywords = [
    "llm-as-a-judge",
    "evaluation",
    "laya",
    "mlx",
    "decision-models",
    "guardrails",
    "rag-evaluation",
    "benchmarking",
    "ai-safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.20.0",
    "rich>=12.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
laya = [
    "laya>=0.3.0",
]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin'",
    "laya-mlx>=0.2.0; sys_platform == 'darwin'",
]
torch = [
    "laya>=0.3.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]
benchmarks = [
    "datasets>=2.18.0",
    "huggingface-hub>=0.20.0",
]
omega = [
    "google-genai>=1.60.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
]
all = [
    "laya-as-judge[mlx,torch,laya,benchmarks,omega]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
laya-judge = "laya_as_judge.cli:main"

[project.urls]
Homepage = "https://github.com/radeksixi/laya-as-judge"
Repository = "https://github.com/radeksixi/laya-as-judge"
"Sixi.ai" = "https://sixi.ai"
"Blog" = "https://radeksixi.github.io"
"Bug Tracker" = "https://github.com/radeksixi/laya-as-judge/issues"
"Laya PyPI Package" = "https://pypi.org/project/laya/"
"Laya MLX Runtime" = "https://github.com/mizorewww/laya-mlx"

[tool.setuptools.packages.find]
where = ["."]
include = ["laya_as_judge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
